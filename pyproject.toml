[project]
name = "softwaretesting"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiokafka>=0.12.0",
    "async-factory-boy>=1.0.1",
    "asyncpg>=0.30.0",
    "factory-boy>=3.3.3",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-factoryboy>=2.8.1",
    "sqlalchemy>=2.0.43",
    "sqlalchemy-guid>=1.0.2",
    "testcontainers[postgres]>=4.13.1",
]

[tool.pytest.ini_options]
# ASYNC MODE
asyncio_mode = "strict" # strict/auto
#WARNINGS
filterwarnings = [
    "ignore::DeprecationWarning"
]
# LOGS
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s %(levelname)s %(name)s:%(lineno)d %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

